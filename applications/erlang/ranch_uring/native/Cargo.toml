[package]
name = "ranch_uring_nif"
version = "0.1.0"
edition = "2021"

[lib]
name = "ranch_uring_nif"
crate-type = ["cdylib", "rlib"]

[features]
default = ["scheduler-fifo", "ingress-kanal"]
scheduler-fifo = ["dataplane-runtime/scheduler-fifo"]
scheduler-shares = ["dataplane-runtime/scheduler-shares"]
exec-strategy-sqpoll = []
current-thread-shard-driver = []
bench-tokio = ["dep:tokio"]
bench-tokio-uring = ["bench-tokio", "dep:tokio-uring"]
bench-smolscale = ["dep:smolscale", "dep:async-channel"]
bench-glommio = ["dep:glommio", "dep:futures-lite"]
bench-trace = []
ingress-kanal = []
ingress-local = []

[dependencies]
rustler = "0.37"
io-uring = "0.7"
socket2 = { version = "0.5", features = ["all"] }
crossbeam-channel = "0.5"
crossbeam-queue = "0.3"
kanal = "0.1"
libc = "0.2"
once_cell = "1"
log = "0.4"
slab = "0.4"
quanta = "0.12"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "net", "io-util", "fs"], optional = true }
tokio-uring = { version = "0.5", optional = true }
smolscale = { version = "0.4", optional = true }
async-channel = { version = "1", optional = true }
glommio = { version = "0.9", optional = true }
futures-lite = { version = "1", optional = true }
dataplane-reactor = { path = "../../../../crates/dataplane-reactor" }
dataplane-core-reactor = { path = "../../../../crates/dataplane-core-reactor" }
dataplane-runtime = { path = "../../../../crates/dataplane-runtime", features = ["erlang-nif"] }
dataplane-nif = { path = "../../../../crates/dataplane-nif" }
